<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="styles.css" />
    <title>Pixl</title>
  </head>

  <body
    class="bg-pixl-dark text-pixl-light flex gap-16 p-4 h-dvh overflow-clip"
  >
    <!-- navigation -->
    <header class="w-40 shrink-0 bg-pixl-light/50 my-4">
      <p>Navigation</p>
    </header>
    <!-- content -->
    <main class="flex flex-col gap-4 overflow-y-auto grow py-4">
      <p>
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Molestiae ex
        libero, accusantium vel natus aperiam eius perspiciatis quaerat laborum,
        fuga atque minus perferendis illo consequatur excepturi dolores aliquam
        reprehenderit similique!
      </p>
    </main>
    <!-- sidebar -->
    <aside class="w-72 shrink-0 my-4">
      <input
        type="text"
        placeholder="#Search an idea or pixel"
        class="w-full border-pixl-light/50"
      />
      <hr class="border-pixl-light/10 mt-2" />
      <div class="p-4 border border-pixl-light/10 rounded-lg mt-4">
        <h2 class="text-pixl-light/60 text-sm">Artists to follow</h2>
      </div>
    </aside>
  </body>
</html>
